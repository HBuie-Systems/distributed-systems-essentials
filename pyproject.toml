[project]
name = "distributed-systems-essentials"
version = "0.1.0"
requires-python = ">=3.10"

[tool.basedpyright]
typeCheckingMode = "all" # This is the strictest setting available
baselineFile = ".basedpyright/baseline.json"


[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# F: Flakes, E: Codestyle, I: Isort, B: Bugbear, C90: Complexity, PTH: Pathlib
select = ["F", "E", "I", "B", "C90", "PTH"]
ignore = ["E501"] # Ignore line length if you prefer

[tool.ruff.lint.mccabe]
max-complexity = 8